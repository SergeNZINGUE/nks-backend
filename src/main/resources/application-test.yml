# Utilisé par les tests d'intégration avec Testcontainers (PostgreSQL réel).
# Le datasource réel est injecté dynamiquement par @DynamicPropertySource dans les classes de test.
spring:
  jpa:
    show-sql: true
  flyway:
    enabled: true

nks:
  payment:
    provider: fake
  sms:
    # Empty on purpose: keeps WhatsappGateway in simulated mode (see HdrStreamWhatsappGateway)
    # so integration tests never attempt a real network call to HDR Stream.
    whatsapp-url: ""
